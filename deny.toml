# cargo-deny (the CI workflow): licences radar may ship, known advisories, and
# where crates come from. The licence list matches about.toml.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "WTFPL",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
yanked = "deny"
# Unmaintained, with no maintained release to move to (checked 2026-10-15). None is a
# vulnerability; each is reached only through the crate named.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode, through syntect's bundled syntax sets" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, through resvg (radar shot's PNG text)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, through resvg's font database" },
    # The SDK's build script uses zip 7 to read a named binary by index into bytes;
    # radar disables bundled-cli and supports no Windows build. Neither the build
    # script nor the enabled runtime calls ZipArchive::extract or
    # ZipStreamReader::extract, the affected APIs.
    # Revisit when a stable SDK release uses zip 9 without changing serde_json's
    # workspace-wide map ordering.
    { id = "RUSTSEC-2026-0367", reason = "github-copilot-sdk 1.0.20 reads named ZIP entries without calling extraction APIs" },
    { id = "RUSTSEC-2026-0368", reason = "github-copilot-sdk 1.0.20 reads named ZIP entries without calling ZipArchive::extract" },
    { id = "RUSTSEC-2026-0369", reason = "github-copilot-sdk 1.0.20 reads named ZIP entries without calling extraction APIs" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
