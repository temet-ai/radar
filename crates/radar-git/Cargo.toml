[package]
name = "radar-git"
description = "radar plugin: git on this machine for any host: checkouts found and linked to repos, branches, editors and terminals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
radar-core.workspace = true
anyhow.workspace = true
clap = { workspace = true, optional = true }
dirs.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

# Sample data for `radar shot` (Plugin::demo); the tests always have it.
[features]
demo = []
# Explicit, isolated local Git fixtures for integration scenarios.
test-support = ["dep:clap"]

[dev-dependencies]
clap.workspace = true
insta.workspace = true
tokio.workspace = true
