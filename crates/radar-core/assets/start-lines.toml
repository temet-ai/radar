group = "tips"
id = "tip-open-copy"
text = "{key:o} opens a row in its service. {key:y} copies its link."
used = "open"

[[line]]
group = "tips"
id = "tip-ask"
text = "{key:A} on any row asks an agent about it."
used = "ask_agent"
when = ["agents.setup >= 1"]

[[line]]
group = "tips"
id = "tip-review-local"
text = "{key:i} on a merge request: an agent reviews, nothing posts."
used = "review_local"
when = ["agents.setup >= 1"]

[[line]]
group = "tips"
id = "tip-dock"
text = "{key:`} shows the agent dock. {key:ctrl-t} starts a session."
used = "dock"
when = ["agents.setup >= 1"]

[[line]]
group = "tips"
id = "tip-slack-mark"
text = "{key:m} in Slack marks read in radar only. Slack never knows."
used = "slack_mark"
when = ["slack.ready"]

[[line]]
group = "tips"
id = "tip-jira-move"
text = "{key:t} moves a ticket along. {key:i} makes it yours."
used = "jira_move"
when = ["jira.ready"]

[[line]]
group = "tips"
id = "tip-history"
text = "{key:H} is History: every write you said yes or no to."
used = "history"

[[line]]
group = "tips"
id = "tip-work"
text = "{key:I} is Work: your own list, kept on this machine."
used = "work"

[[line]]
group = "tips"
id = "tip-checkout"
text = "{key:c} on a merge request checks out its branch here."
used = "checkout"
when = ["git.repos >= 1"]

[[line]]
group = "tips"
id = "tip-settings"
text = "{key:,} is Settings. Every row says what it writes."
used = "settings"

[[line]]
group = "tips"
id = "tip-own-lines"
text = "Write your own start lines: Settings / General."
when = ["start.count >= 50"]

[[line]]
group = "tips"
id = "tip-lines-off"
text = "Had enough of these? Settings / General turns them off."
when = ["start.count >= 100"]
