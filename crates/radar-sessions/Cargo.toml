[package]
name = "radar-sessions"
description = "radar plugin: agent sessions (Copilot, Codex, Claude Code, any CLI in a PTY) and the dock they feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
radar-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# net, io-util, io-std: the per-session MCP socket and the `radar mcp` relay (tools.rs).
tokio = { workspace = true, features = ["net", "io-util", "io-std"] }

[features]
demo = []
test-support = []

[dev-dependencies]
radar-core = { workspace = true, features = ["test-support"] }
tokio.workspace = true
