[[day]]
id = "gap-long"
text = "Welcome back. {n:thing} happened. radar read them all."
when = ["start.gap_days >= 3", "changes.since_last >= 1"]

[[day]]
id = "gap-quiet"
text = "Welcome back. Nothing happened. Genuinely nothing."
when = ["start.gap_days >= 3", "changes.since_last == 0"]

# --------------------------------------------------------------- animated
# Special events. 1 in 300, at most one a month, only at motion full. An
# event owns the splash: its animation takes the mark's place (rows 26-33,
# no mark, no parts row) and its words take the line's. The splash holds
# 1.5 s longer; any key skips. Never over a failure: none of these shows
# while a plain line or a failing pipeline is held. A day line with `anim`
# (snow, confetti) is an event too.
# stage = "mark": the animation draws where the mark would (64 x 8 cells).

[[animated]]
id = "this-is-fine"
text = "This is fine."
anim = "fire"
when = ["pipelines.failing == 0"]

[[animated]]
id = "tumbleweed"
text = "Nothing to review. Nothing at all."
anim = "tumbleweed"
when = ["reviews.count == 0"]

[[animated]]
id = "duck-walk"
text = "The duck has been consulted. It had no comment."
anim = "duck"
emoji = true

[[animated]]
id = "ufo"
text = "Unidentified contact. Probably nothing."
anim = "ufo"
emoji = true

[[animated]]
id = "brewing"
text = "Brewing."
anim = "steam"
emoji = true
when = ["hour < 10"]

