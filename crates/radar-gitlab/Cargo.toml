[package]
name = "radar-gitlab"
description = "radar plugin: merge requests across GitLab tenancies, with views, filters and sources settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
radar-core.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tui-tree-widget.workspace = true
toml.workspace = true

# Sample data for `radar shot` (Plugin::demo); the tests always have it.
[features]
demo = []
# Explicit offline model and provider fixtures for root integration tests.
test-support = []

[dev-dependencies]
radar-core = { workspace = true, features = ["test-support"] }
insta.workspace = true
tokio.workspace = true
