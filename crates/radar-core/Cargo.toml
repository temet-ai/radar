[package]
name = "radar-core"
description = "The radar host: plugin contract, universal layout, settings, config, event loop and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
opaline.workspace = true
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
url.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["process", "net", "io-util"] }
toml.workspace = true
toml_edit.workspace = true
base64.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
syntect.workspace = true
similar.workspace = true
emojis.workspace = true
image.workspace = true
# The IPC messages' TypeScript side (ink/src/protocol/generated/).
ts-rs = { version = "12", features = ["serde-json-impl"] }

[features]
# Opt-in for other workspace crates' scratch-SQLite integration fixtures only.
test-support = []

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["test-util"] }
