# cargo-about (scripts/notices): the licences radar's Rust dependencies may use, in the
# order a choice between several is made.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "MPL-2.0",
    "Unlicense",
    "WTFPL",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# radar's own crates are MIT (LICENSE) and are not third parties.
[private]
ignore = true
