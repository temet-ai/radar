# radar's start lines: one under the mark, a new one each start.
#
# Shipped inside radar; a user's own file (~/.config/radar/start-lines.toml)
# is read after it and may add lines, turn groups off or change weights.
#
# text      at most 56 cells once every placeholder is at its widest
#           (an emoji is 2 cells).
# {name}    a fact radar already holds (see FACTS); never fetched for a line.
#           Names are cut to 16 cells with an ellipsis, counts stop at 999.
# {n:word}  a count with its noun: "1 branch", "3 branches"
#           ({n:branch|branches} when the plural is not word + s).
# {key:x}   a key, drawn in the key colour.
# when      every condition must hold; a fact radar does not hold, or holds
#           from more than a day ago, makes the line ineligible.
# emoji     true when the line needs emoji: skipped unless [theme] icons is
#           auto or emoji and the terminal draws them.
# anim      very rare: the line comes with a small animation in the tagline's
#           row. Needs motion = full; otherwise the line is skipped.
# id        stable: the state file remembers lines by id, never by text.

version = 1

# ------------------------------------------------------------------ order
# Checked top to bottom; the first that yields a line wins.
#   plain      something is wrong: a plain line, never a joke
#   first_run  the first start ever
#   day        first start of the day only: date, milestone, news, gap
#   animated   1 in 300 starts, at most one a month, motion full only
#   rare       1 in 100 starts, at most one a week
#   draw       a weighted draw over the groups below

[draw]
weights = { scope = 20, work = 24, facts = 22, tips = 10, agents = 10, time = 9, glyph = 5 }
tips_early = 25          # the tips weight for the first 30 starts
same_group_max = 2       # never three starts in a row from one group
facts_unchanged = "skip" # a fact line whose numbers are the same as when it last showed waits

[odds]
rare = { chance = 0.01, min_days_between = 7 }
animated = { chance = 0.0033, min_days_between = 30 }

# A group whose every line also needs these conditions (agents: only when one
# is set up).
[gates]
agents = ["agents.setup >= 1"]

# The widest a text placeholder gets, for the 56-cell check. A placeholder
# that is not a count (n, m, days, today, starts) is the fact of that name;
# it must be listed here. {time} is the clock when no fact holds it.
[widest]
repo = "xxxxxxxxxxxxxxxx"
ticket = "WATCH-1234"
agent = "Copilot"
agent2 = "Copilot"
mr = "!1234"
time = "03:00"
version = "0.12.10"
service = "GitLab"

# ------------------------------------------------------------------ plain
# No jokes, no emoji. These win over everything; the most important shows.

[[plain]]
id = "crashed"
text = "radar closed unexpectedly last time. Your tabs are back."
when = ["start.after_crash"]

[[plain]]
id = "signed-out"
text = "{service} wants you to sign in again: Settings / {service}."
when = ["auth.expired"]

[[plain]]
id = "scope-lost"
text = "The Slack token lost a scope. Settings / Slack has it."
when = ["slack.scope_missing"]

[[plain]]
id = "no-answer"
text = "{service} didn't answer last time. Asking again."
when = ["sync.last_failed"]

[[plain]]
id = "offline"
text = "Offline. Showing what radar held at {time}."
when = ["net.offline"]

[[plain]]
id = "pipes-failed"
text = "{n:pipeline} of yours failed since your last start."
when = ["pipelines.failed_new >= 1"]

# -------------------------------------------------------------- first run

[[first_run]]
id = "first-contact"
text = "First contact. Let's see what's out there."

