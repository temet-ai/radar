# ------------------------------------------------------------------ facts
# Only when true, from what radar already holds. The sweep's blips already
# show the counts, so a fact line says what a count does not: how old, how
# it changed, what to do next.

[[line]]
group = "facts"
id = "oldest-mr"
text = "Your oldest open merge request turns {days} today. 🎂"
emoji = true
when = ["mine.oldest_days >= 7"]

[[line]]
group = "facts"
id = "oldest-mr-plain"
text = "Your oldest open merge request is {days} days old."
when = ["mine.oldest_days >= 7", "no_emoji"]

[[line]]
group = "facts"
id = "ready-to-merge"
text = "{mr} is approved and green. {key:m} merges it."
when = ["mine.ready >= 1"]

[[line]]
group = "facts"
id = "behind-main"
text = "{n:merge request} of yours behind main. {key:u} rebases."
when = ["mine.behind >= 1"]

[[line]]
group = "facts"
id = "queue-down"
text = "Review queue: {n}, down from {m}. Look at you."
when = ["reviews.count < reviews.prev"]

[[line]]
group = "facts"
id = "queue-empty"
text = "Nobody needs a review from you. Suspicious."
when = ["reviews.count == 0"]

[[line]]
group = "facts"
id = "staring"
text = "{n:merge request}, staring at you. 👀"
emoji = true
when = ["reviews.count >= 3"]

[[line]]
