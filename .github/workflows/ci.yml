name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - name: Licences, advisories and sources
        run: cargo deny check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo nextest run --workspace --all-features --locked
      - name: Each part alone, none, and all together
        run: scripts/check-mixes --quick

  ink:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ink/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  sidecar:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: sidecars/claude-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci --omit=optional --no-audit --no-fund
      - run: npm test
